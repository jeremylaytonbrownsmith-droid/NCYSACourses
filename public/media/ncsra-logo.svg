  <!-- referee cards motif -->
  <g transform="translate(60 44) rotate(-8)">
    <rect x="-16" y="-16" width="20" height="28" rx="3" fill="#edc32c"/>
    <rect x="-4" y="-13" width="20" height="28" rx="3" fill="#b82f2f" transform="rotate(12)"/>
  </g>
  <text x="60" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">NCSRA</text>
  <text x="60" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="7.5" font-weight="700" fill="#c9c3e8" letter-spacing="0.5">REFEREE EDUCATION</text>
</svg>
