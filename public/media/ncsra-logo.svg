<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="NCSRA">
  <defs>
    <linearGradient id="ncsra-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b6e"/>
      <stop offset="1" stop-color="#0a0340"/>
    </linearGradient>
  </defs>
  <!-- crest -->
  <path d="M60 6 L106 20 V60 C106 88 86 106 60 116 C34 106 14 88 14 60 V20 Z"
