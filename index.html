<style>
/* NCYSA Learn — design system
   Look & feel modeled on modern course platforms (Thinkific/Teachable):
   clean white surfaces, one strong brand color, generous spacing,
   card-based catalog, player with dark curriculum sidebar. */

:root {
  --brand: #10045a;          /* NCYSA navy */
  --brand-dark: #0a0340;
  --accent: #b82f2f;         /* NCYSA swoosh red (calls to action) */
  --accent-dark: #8f1f1f;
  --success: #2eaf6d;        /* completed states */
  --success-dark: #1f8a52;
  --ink: #1d1a18;
  --ink-soft: #6b645e;
  --line: #e9e4dd;
  --bg: #f9f7f7;
  --card: #ffffff;
  --danger: #b82f2f;
  --gold: #edc32c;
  --link: var(--brand);
  --logo-ink: var(--brand-dark);
  --ink-body: #3d3833;
  --field-bg: #fdfcfa;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(18, 40, 66, 0.08);
  font-size: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.6;
}

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top nav ---------- */
.topnav {
  position: sticky; top: 0; z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 64px;
}
.topnav .logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.15rem; color: var(--logo-ink);
  letter-spacing: -0.01em;
}
.topnav .logo .ball { font-size: 1.4rem; }
.topnav .logo .sub {
  font-size: 0.68rem; font-weight: 600; color: var(--ink-soft);
  display: block; letter-spacing: 0.06em; text-transform: uppercase;
}
.topnav .spacer { flex: 1; }
.topnav .navlink { font-weight: 600; color: var(--ink-soft); padding: 8px 10px; border-radius: 8px; }
.topnav .navlink:hover { background: var(--bg); text-decoration: none; color: var(--ink); }

.bell { position: relative; cursor: pointer; font-size: 1.25rem; padding: 6px 10px; border-radius: 8px; background: none; border: none; }
.bell:hover { background: var(--bg); }
.bell .dot {
  position: absolute; top: 2px; right: 4px;
  background: var(--danger); color: #fff; font-size: 0.62rem; font-weight: 700;
  border-radius: 999px; padding: 0 5px; min-width: 16px; text-align: center; line-height: 16px;
}

.btn {
  display: inline-block; border: none; cursor: pointer; font: inherit; font-weight: 700;
  border-radius: 10px; padding: 10px 20px; transition: all 0.15s ease;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); text-decoration: none; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-dark); text-decoration: none; }
.btn-ghost { background: transparent; color: var(--link); border: 2px solid var(--link); }
.btn-ghost:hover { background: var(--brand); color: #fff; text-decoration: none; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-lg { padding: 14px 28px; font-size: 1.05rem; }

/* ---------- hero / landing ---------- */
.hero {
  background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand) 55%, #2d1f8f 100%);
  color: #fff; padding: 72px 24px 84px; text-align: center;
}
.hero h1 { font-size: clamp(1.9rem, 4.5vw, 3.1rem); letter-spacing: -0.02em; line-height: 1.15; max-width: 780px; margin: 0 auto 18px; }
.hero p { font-size: 1.15rem; max-width: 640px; margin: 0 auto 30px; color: #d9d4f2; }
.hero .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero .btn-ghost { color: #fff; border-color: rgba(255,255,255,0.7); }
.hero .btn-ghost:hover { background: rgba(255,255,255,0.14); color: #fff; }

.feature-strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px; max-width: 1020px; margin: -46px auto 0; padding: 0 24px;
}
.feature {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 22px; text-align: left;
}
.feature .fi { font-size: 1.6rem; }
.feature h3 { font-size: 1rem; margin: 8px 0 4px; }
.feature p { font-size: 0.9rem; color: var(--ink-soft); }

/* ---------- catalog ---------- */
.section { max-width: 1020px; margin: 0 auto; padding: 56px 24px; }
.section > h2 { font-size: 1.7rem; letter-spacing: -0.01em; margin-bottom: 6px; }
.section > .lead { color: var(--ink-soft); margin-bottom: 28px; }

.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
.course-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease;
}
.course-card:hover { transform: translateY(-3px); }
.course-card .thumb {
  background: linear-gradient(135deg, #0a0340, var(--brand));
  color: #fff; height: 150px; display: flex; align-items: center; justify-content: center;
  font-size: 3.4rem; position: relative;
}
.course-card .badge {
  position: absolute; top: 12px; left: 12px; background: var(--gold); color: #5b4708;
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  border-radius: 999px; padding: 3px 10px;
}
.course-card .body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.course-card h3 { font-size: 1.12rem; line-height: 1.35; }
.course-card .meta { font-size: 0.82rem; color: var(--ink-soft); }
.course-card .desc { font-size: 0.9rem; color: var(--ink-soft); flex: 1; }
.course-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill-done { background: #e7f6ee; color: var(--success-dark); font-weight: 700; font-size: 0.8rem; border-radius: 999px; padding: 4px 12px; }

.progress-track { background: var(--line); border-radius: 999px; height: 8px; overflow: hidden; }
.progress-fill { background: var(--gold); height: 100%; border-radius: 999px; transition: width 0.4s ease; }

/* ---------- auth card ---------- */
.auth-wrap { max-width: 420px; margin: 60px auto; padding: 0 20px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px; }
.card h2 { margin-bottom: 4px; }
.card .sub { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; }
.field input {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 9px;
  font: inherit; background: var(--field-bg);
}
.field input:focus { outline: none; border-color: var(--brand); }
.form-error { color: var(--danger); font-size: 0.88rem; margin: 8px 0; min-height: 1.2em; }
.auth-alt { text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--ink-soft); }

/* ---------- course player ---------- */
.player-layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 64px); }
@media (max-width: 860px) { .player-layout { grid-template-columns: 1fr; } }

.curriculum {
  background: #120b3d; color: #d4d0e8; padding: 20px 0 40px;
}
.curriculum .course-head { padding: 6px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.09); }
.curriculum .course-head h2 { color: #fff; font-size: 1.02rem; line-height: 1.4; }
.curriculum .course-head .prog-label { font-size: 0.78rem; margin: 10px 0 6px; color: #a9a3cf; }
.curriculum .progress-track { background: rgba(255,255,255,0.15); }
.lesson-item {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 13px 20px; border: none; background: none; color: inherit; font: inherit;
  cursor: pointer; border-left: 3px solid transparent;
}
.lesson-item:hover { background: rgba(255,255,255,0.06); }
.lesson-item.active { background: rgba(255,255,255,0.1); border-left-color: var(--gold); color: #fff; }
.lesson-item.locked { opacity: 0.45; cursor: not-allowed; }
.lesson-item .stat { font-size: 1rem; width: 22px; flex: none; text-align: center; }
.lesson-item .stat.done { color: var(--success); }
.lesson-item .l-title { font-size: 0.9rem; line-height: 1.35; }
.lesson-item .l-type { display: block; font-size: 0.72rem; color: #9b95c4; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

.lesson-pane { padding: 40px clamp(20px, 5vw, 64px); max-width: 860px; }
.lesson-pane .lesson-kind { color: var(--link); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; }
.lesson-pane h1 { font-size: 1.75rem; letter-spacing: -0.01em; margin: 6px 0 20px; }
.lesson-content h2 { font-size: 1.3rem; margin: 22px 0 10px; }
.lesson-content h3 { font-size: 1.08rem; margin: 18px 0 8px; }
.lesson-content p, .lesson-content li { color: var(--ink-body); }
.lesson-content ul, .lesson-content ol { padding-left: 24px; margin: 10px 0; }
.lesson-content li { margin: 6px 0; }
.lesson-content blockquote {
  border-left: 4px solid var(--gold); background: #fdf7e6; padding: 12px 16px;
  border-radius: 0 8px 8px 0; margin: 16px 0; font-style: italic;
}
.lesson-content table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 0.92rem; }
.lesson-content th, .lesson-content td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.lesson-content th { background: var(--bg); }

.lesson-actions { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.gate-note { font-size: 0.88rem; color: var(--ink-soft); }
.gate-note.err { color: var(--danger); font-weight: 600; }

/* ---------- video player ---------- */
.video-shell { background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.video-shell video { width: 100%; display: block; }
.v-controls { display: flex; align-items: center; gap: 12px; background: #0d0a24; padding: 10px 14px; color: #e7eef5; }
.v-controls button { background: none; border: none; color: inherit; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.v-controls button:hover { background: rgba(255,255,255,0.12); }
.v-track { flex: 1; height: 8px; background: rgba(255,255,255,0.2); border-radius: 999px; position: relative; overflow: hidden; }
.v-track .v-fill { height: 100%; background: var(--gold); border-radius: 999px; width: 0; }
.v-time { font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.watch-meter { margin-top: 14px; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
.watch-meter .progress-track { flex: 1; height: 10px; }
.watch-meter .ok { color: var(--success-dark); font-weight: 700; }
.no-skip-tip { margin-top: 8px; font-size: 0.8rem; color: var(--ink-soft); }

/* ---------- quiz ---------- */
.quiz-q { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin: 16px 0; }
.quiz-q h3 { font-size: 1rem; margin-bottom: 12px; }
.quiz-opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
.quiz-opt:hover { background: var(--bg); }
.quiz-opt input { margin-top: 5px; }
.quiz-result { border-radius: var(--radius); padding: 18px 22px; margin: 18px 0; font-weight: 600; }
.quiz-result.pass { background: #e7f6ee; color: var(--success-dark); }
.quiz-result.fail { background: #fdecea; color: var(--danger); }

/* ---------- completion / certificate ---------- */
.complete-hero { text-align: center; padding: 46px 20px; }
.complete-hero .big { font-size: 4rem; }
.complete-hero h1 { font-size: 2rem; margin: 12px 0 8px; }
.complete-hero p { color: var(--ink-soft); max-width: 560px; margin: 0 auto 8px; }
.notice-sent {
  display: inline-flex; align-items: center; gap: 8px; margin: 18px auto 8px;
  background: #efedf7; color: var(--brand-dark); border: 1px solid #d5d0ea;
  border-radius: 999px; padding: 8px 18px; font-size: 0.9rem; font-weight: 600;
}

.certificate {
  max-width: 720px; margin: 48px auto; background: #fffdf6;
  border: 3px double var(--gold); border-radius: 6px; padding: 56px 40px; text-align: center;
  box-shadow: var(--shadow);
}
.certificate .org { text-transform: uppercase; letter-spacing: 0.25em; font-size: 0.78rem; color: var(--ink-soft); }
.certificate h1 { font-size: 2rem; color: var(--brand-dark); margin: 10px 0 26px; }
.certificate .learner-name { font-size: 2.2rem; font-family: Georgia, serif; font-style: italic; color: var(--ink); margin: 8px 0; }
.certificate .course-name { font-size: 1.2rem; font-weight: 700; margin: 8px 0 20px; }
.certificate .cert-meta { color: var(--ink-soft); font-size: 0.9rem; }
.certificate .seal { font-size: 2.6rem; margin-top: 18px; }

/* ---------- notifications & admin ---------- */
.notif-list { max-width: 720px; margin: 40px auto; padding: 0 20px; }
.notif {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 22px; margin-bottom: 14px; border-left: 4px solid var(--gold);
}
.notif.unread { border-left-color: var(--danger); }
.notif h3 { font-size: 1rem; }
.notif time { font-size: 0.78rem; color: var(--ink-soft); }
.notif p { font-size: 0.92rem; color: var(--ink-body); margin-top: 6px; }

.admin-wrap { max-width: 1020px; margin: 36px auto; padding: 0 20px; }
.admin-wrap h1 { margin-bottom: 4px; }
.admin-grid { display: grid; gap: 22px; margin-top: 24px; }
.admin-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; overflow-x: auto; }
.admin-card h2 { font-size: 1.1rem; margin-bottom: 14px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.admin-table th, .admin-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.admin-table th { color: var(--ink-soft); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
.mail { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; font-size: 0.88rem; }
.mail .mail-head { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 6px; }
.mail pre { white-space: pre-wrap; font: inherit; color: var(--ink-body); }
.empty { color: var(--ink-soft); font-size: 0.9rem; }

/* ---------- toast ---------- */
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: #1d1a18; color: #fff; border-radius: 10px; padding: 12px 22px;
  font-size: 0.92rem; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease; z-index: 50; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }
#toast.error { background: var(--danger); }

.footer { text-align: center; color: var(--ink-soft); font-size: 0.85rem; padding: 40px 20px; }

/* ---------- brand mark ---------- */
.topnav .logo .brandmark {
  height: 50px; width: auto; display: block;
  background: var(--logo-plate, transparent); border-radius: 6px; padding: 2px;
}
.certificate .cert-logo { height: 116px; margin-bottom: 16px; }
.hero-logo { height: 132px; margin-bottom: 20px; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.35)); }
.course-card .thumb .thumb-logo { height: 84px; margin-top: 12px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); }


/* ---------- demo bar ---------- */
.demo-bar {
  background: #1d1a18; color: #f9f7f7; font-size: 0.82rem; padding: 8px 16px;
  display: flex; gap: 8px 22px; align-items: center; flex-wrap: wrap; justify-content: center;
}
.demo-bar code { background: rgba(255,255,255,0.16); padding: 1px 7px; border-radius: 5px; font-size: 0.78rem; }
.demo-bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.demo-bar button {
  background: none; border: 1px solid rgba(255,255,255,0.45); color: inherit;
  border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 0.78rem;
}
.demo-bar button:hover { background: rgba(255,255,255,0.14); }

/* ---------- themes (token layer) ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eceaf2; --ink-soft: #a29caf; --line: #2e2b3f; --bg: #131020; --card: #1c192b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); --link: #a9b4f2; --logo-ink: #eceaf2;
    --ink-body: #cbc7d6; --field-bg: #171425; --logo-plate: #ffffff;
  }
}
:root[data-theme="dark"] {
  --ink: #eceaf2; --ink-soft: #a29caf; --line: #2e2b3f; --bg: #131020; --card: #1c192b;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); --link: #a9b4f2; --logo-ink: #eceaf2;
  --ink-body: #cbc7d6; --field-bg: #171425; --logo-plate: #ffffff;
}
:root[data-theme="light"] {
  --ink: #1d1a18; --ink-soft: #6b645e; --line: #e9e4dd; --bg: #f9f7f7; --card: #ffffff;
  --shadow: 0 2px 10px rgba(18, 40, 66, 0.08); --link: var(--brand); --logo-ink: var(--brand-dark);
  --ink-body: #3d3833; --field-bg: #fdfcfa; --logo-plate: transparent;
}
/* The certificate stays printed-paper cream in both themes */
.certificate { --ink: #1d1a18; --ink-soft: #6b645e; --link: #10045a; color: #1d1a18; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>

<nav class="topnav" id="topnav"></nav>
<main id="app"></main>
<div id="toast"></div>

// Replaces the Express server with an in-browser implementation of the same
// API, same gating rules. State persists in localStorage.
const DB_KEY = 'ncysa-learn-demo-db';

function demoLoad() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || null; } catch { return null; }
}
let DB = demoLoad() || {
  users: [{ id: 'usr_admin', name: 'NCYSA Education Staff', email: 'admin@ncysa.org', password: 'ncysa-admin', role: 'admin' }],
  currentUserId: null,
  enrollments: [], lessonProgress: [], notifications: [], outbox: [],
};
function demoSave() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function demoId(p) { return p + '_' + Math.random().toString(16).slice(2, 10); }
function demoUser() { return DB.users.find((u) => u.id === DB.currentUserId) || null; }

function mockProgress(userId, courseId) {
  return DB.lessonProgress.filter((p) => p.userId === userId && p.courseId === courseId);
}
function mockLessonState(course, progress, lessonId) {
  const idx = course.lessons.findIndex((l) => l.id === lessonId);
  const done = (lid) => progress.some((p) => p.lessonId === lid && p.completed);
  return {
    idx,
    unlocked: course.lessons.slice(0, idx).every((l) => done(l.id)),
    completed: done(lessonId),
  };
}
function mockSummary(course, progress) {
  const done = course.lessons.filter((l) => progress.some((p) => p.lessonId === l.id && p.completed)).length;
  return {
    completedLessons: done,
    totalLessons: course.lessons.length,
    percent: Math.round((done / course.lessons.length) * 100),
    lessons: course.lessons.map((l) => {
      const st = mockLessonState(course, progress, l.id);
      const rec = progress.find((p) => p.lessonId === l.id);
      return { id: l.id, completed: st.completed, unlocked: st.unlocked,
               watchedSeconds: rec?.watchedSeconds || 0, quizScore: rec?.quizScore ?? null };
    }),
  };
}
function mockUpsert(userId, courseId, lessonId) {
  let rec = DB.lessonProgress.find((p) => p.userId === userId && p.courseId === courseId && p.lessonId === lessonId);
  if (!rec) {
    rec = { userId, courseId, lessonId, watchedSeconds: 0, completed: false, completedAt: null, quizScore: null };
    DB.lessonProgress.push(rec);
  }
  return rec;
}

}
function mockMaybeComplete(user, course) {
  const enr = DB.enrollments.find((e) => e.userId === user.id && e.courseId === course.id);
  if (!enr || enr.completedAt) return null;
  const progress = mockProgress(user.id, course.id);
  if (!course.lessons.every((l) => progress.some((p) => p.lessonId === l.id && p.completed))) return null;
  enr.completedAt = new Date().toISOString();
  enr.certId = 'NCYSA-' + Math.random().toString(16).slice(2, 10).toUpperCase();
  const quiz = progress.find((p) => p.quizScore != null);
  const scoreLine = quiz ? ` Final exam score: ${quiz.quizScore}%.` : '';
  const when = new Date().toLocaleString();
  mockNotify({ audience: 'user', userId: user.id,
    title: `🎉 You completed ${course.title}!`,
    body: `Congratulations, ${user.name}! Your certificate (${enr.certId}) is ready.${scoreLine}` });
  mockEmail(user.email, `Congratulations — you completed ${course.title}`,
    `Hi ${user.name},\n\nYou have successfully completed "${course.title}" on ${when}.${scoreLine}\n\n` +
    `Your certificate ID is ${enr.certId}.\n\nGood luck this season, Coach!\n— NCYSA Learn`);
  mockNotify({ audience: 'ncysa', userId: null,
    title: `Course completion: ${course.title}`,
    body: `${user.name} (${user.email}) completed the course on ${when}. Certificate ${enr.certId}.${scoreLine}` });
  mockEmail('education@ncysa.org', `[NCYSA Learn] ${user.name} completed ${course.title}`,
    `Completion record\n=================\nLearner: ${user.name}\nEmail: ${user.email}\n` +
    `Course: ${course.title}\nCompleted: ${when}\nCertificate: ${enr.certId}\n\n` +
    `This learner's coaching license can now be recorded.`);
  return enr;
}

// The demo's fetch(): routes /api/* to the mock, mirrors the Response shape.
function mockFetch(path, opts = {}) {
  const body = opts.body ? JSON.parse(opts.body) : {};
  const user = demoUser();
  const R = (status, data) => ({ ok: status < 400, status, statusText: '', json: async () => data });
  const need = () => R(401, { error: 'Not signed in' });

  let m;
  if (path === '/api/me') {
    if (!user) return R(200, { user: null });
    const unread = DB.notifications.filter((n) => n.audience === 'user' && n.userId === user.id && !n.read).length;
    return R(200, { user: { id: user.id, name: user.name, email: user.email, role: user.role }, unread });
  }
  if (path === '/api/register') {
    if (!body.name || !body.email || !body.password) return R(400, { error: 'Name, email and password are required' });
    if (DB.users.some((u) => u.email.toLowerCase() === body.email.toLowerCase()))
      return R(409, { error: 'An account with that email already exists' });
    const u = { id: demoId('usr'), name: body.name, email: body.email, password: body.password, role: 'learner' };
    DB.users.push(u); DB.currentUserId = u.id; demoSave();
    return R(200, { user: u });
  }
  if (path === '/api/login') {
    const u = DB.users.find((x) => x.email.toLowerCase() === String(body.email).toLowerCase() && x.password === body.password);
    if (!u) return R(401, { error: 'Invalid email or password' });
    DB.currentUserId = u.id; demoSave();
    return R(200, { user: u });
  }
  if (path === '/api/logout') { DB.currentUserId = null; demoSave(); return R(200, { ok: true }); }

  if (path === '/api/courses') {
    return R(200, { courses: COURSES.map((c) => {
      const enr = user && DB.enrollments.find((e) => e.userId === user.id && e.courseId === c.id);
      const prog = user ? mockSummary(c, mockProgress(user.id, c.id)) : null;
      return { id: c.id, title: c.title, tagline: c.tagline, description: c.description,
        badge: c.badge, estMinutes: c.estMinutes, heroEmoji: c.heroEmoji, lessonCount: c.lessons.length,
        enrolled: !!enr, completedAt: enr?.completedAt || null, certId: enr?.certId || null,
        percent: prog?.percent ?? 0 };
    }) });
  }

  if ((m = path.match(/^\/api\/courses\/([\w-]+)\/enroll$/))) {
    if (!user) return need();
    const course = COURSES.find((c) => c.id === m[1]);
    if (!course) return R(404, { error: 'Course not found' });
    if (!DB.enrollments.some((e) => e.userId === user.id && e.courseId === course.id)) {
      DB.enrollments.push({ userId: user.id, courseId: course.id, startedAt: new Date().toISOString(), completedAt: null, certId: null });
      demoSave();
    }
    return R(200, { ok: true });
  }

  if ((m = path.match(/^\/api\/courses\/([\w-]+)$/))) {
    if (!user) return need();
    const course = COURSES.find((c) => c.id === m[1]);
    if (!course) return R(404, { error: 'Course not found' });
    const enr = DB.enrollments.find((e) => e.userId === user.id && e.courseId === course.id);
    if (!enr) return R(403, { error: 'Enroll in this course first' });
    return R(200, { course: mockPublicCourse(course), progress: mockSummary(course, mockProgress(user.id, course.id)), enrollment: enr });
  }

  if ((m = path.match(/^\/api\/courses\/([\w-]+)\/lessons\/([\w-]+)\/(watch|quiz|complete)$/))) {
    if (!user) return need();
    const course = COURSES.find((c) => c.id === m[1]);
    const lesson = course?.lessons.find((l) => l.id === m[2]);
    if (!course || !lesson) return R(404, { error: 'Lesson not found' });
    const progress = mockProgress(user.id, course.id);
    const st = mockLessonState(course, progress, lesson.id);
    if (!st.unlocked) return R(403, { error: 'This lesson is locked. Complete the previous lessons first.' });

    if (m[3] === 'watch') {
      const rec = mockUpsert(user.id, course.id, lesson.id);
      const CAP = 30;
      const position = Number(body.position);
      if (Number.isFinite(position)) {
        rec.watchedSeconds = Math.min(lesson.durationSeconds,
          Math.max(rec.watchedSeconds, Math.min(position, rec.watchedSeconds + CAP)));
      } else {
        rec.watchedSeconds = Math.min(lesson.durationSeconds,
          rec.watchedSeconds + Math.max(0, Math.min(Number(body.secondsWatched) || 0, CAP)));
      }
      demoSave();
      return R(200, { watchedSeconds: rec.watchedSeconds, required: lesson.minWatchSeconds,
                      satisfied: rec.watchedSeconds >= lesson.minWatchSeconds });
    }
    if (m[3] === 'quiz') {
      const answers = body.answers || {};
      const correct = lesson.questions.filter((q) => Number(answers[q.id]) === q.answer).length;
      const score = Math.round((correct / lesson.questions.length) * 100);
      const passed = score >= lesson.passPercent;
      const rec = mockUpsert(user.id, course.id, lesson.id);
      rec.quizScore = score;
      if (passed && !rec.completed) { rec.completed = true; rec.completedAt = new Date().toISOString(); }
      const completion = passed ? mockMaybeComplete(user, course) : null;
      demoSave();
      return R(200, { score, passed, passPercent: lesson.passPercent, correct, total: lesson.questions.length,
                      courseCompleted: !!completion, certId: completion?.certId || null });
    }
    // complete
    if (lesson.type === 'quiz') return R(400, { error: 'The exam must be submitted and passed, not marked complete.' });
    const rec = mockUpsert(user.id, course.id, lesson.id);
    if (lesson.type === 'video' && rec.watchedSeconds < lesson.minWatchSeconds) {
      return R(403, { error: `You must watch at least ${lesson.minWatchSeconds} seconds of this video to continue. ` +
                             `Watched so far: ${Math.floor(rec.watchedSeconds)}s.` });
    }
    if (!rec.completed) { rec.completed = true; rec.completedAt = new Date().toISOString(); }
    const completion = mockMaybeComplete(user, course);
    demoSave();
    return R(200, { ok: true, courseCompleted: !!completion, certId: completion?.certId || null });
  }

  if (path === '/api/notifications') {
    if (!user) return need();
    return R(200, { notifications: DB.notifications
      .filter((n) => n.audience === 'user' && n.userId === user.id)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt)) });
  }
  if (path === '/api/notifications/read') {
    if (!user) return need();
    DB.notifications.forEach((n) => { if (n.audience === 'user' && n.userId === user.id) n.read = true; });
    demoSave();
    return R(200, { ok: true });
  }
  if ((m = path.match(/^\/api\/certificate\/([\w-]+)$/))) {
    if (!user) return need();
    const enr = DB.enrollments.find((e) => e.certId === m[1]);
    if (!enr || (enr.userId !== user.id && user.role !== 'admin')) return R(404, { error: 'Certificate not found' });
    const owner = DB.users.find((u) => u.id === enr.userId);
    const course = COURSES.find((c) => c.id === enr.courseId);
    return R(200, { certId: enr.certId, learner: owner.name, course: course.title, completedAt: enr.completedAt });
  }
  if (path === '/api/admin/overview') {
    if (!user) return need();
    if (user.role !== 'admin') return R(403, { error: 'NCYSA staff only' });
    return R(200, {
      completions: DB.enrollments.filter((e) => e.completedAt).map((e) => ({
        learner: DB.users.find((u) => u.id === e.userId)?.name,
        email: DB.users.find((u) => u.id === e.userId)?.email,
        course: COURSES.find((c) => c.id === e.courseId)?.title,
        completedAt: e.completedAt, certId: e.certId,
      })).sort((a, b) => b.completedAt.localeCompare(a.completedAt)),
      ncysaNotifications: DB.notifications.filter((n) => n.audience === 'ncysa').sort((a, b) => b.createdAt.localeCompare(a.createdAt)),
      outbox: DB.outbox.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)),
      learnerCount: DB.users.filter((u) => u.role === 'learner').length,
    });
  }
  return R(404, { error: 'Not found: ' + path });
}
const fetch = (path, opts) => Promise.resolve(mockFetch(path, opts));

// ---------- utilities ----------

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'content-type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status, data });
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ''), 3500);
}

function fmtTime(s) {
  s = Math.floor(s);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ---------- course player ----------

async function viewCourse(courseId, lessonId) {
  if (!me?.user) { location.hash = '#/login'; return; }
  let data;
  try { data = await api(`/api/courses/${courseId}`); }
  catch (e) {
    if (e.status === 403) { await api(`/api/courses/${courseId}/enroll`, { method: 'POST' }); data = await api(`/api/courses/${courseId}`); }
    else throw e;
  }
  const { course, progress } = data;

  // Default to the first incomplete unlocked lesson ("continue where you left off").
  if (!lessonId) {
    const next = progress.lessons.find((l) => l.unlocked && !l.completed) || progress.lessons[progress.lessons.length - 1];
    lessonId = next.id;
  }
  const lesson = course.lessons.find((l) => l.id === lessonId) || course.lessons[0];
  const lp = progress.lessons.find((l) => l.id === lesson.id);

  const typeLabel = { text: '📖 Reading', video: '🎬 Video', quiz: '📝 Exam' };
  app.innerHTML = `
    <div class="player-layout">
      <aside class="curriculum">
        <div class="course-head">
          <h2>${esc(course.title)}</h2>
          <div class="prog-label">${progress.completedLessons} of ${progress.totalLessons} lessons complete · ${progress.percent}%</div>
          <div class="progress-track"><div class="progress-fill" style="width:${progress.percent}%"></div></div>
        </div>
        ${course.lessons.map((l, i) => {
          const st = progress.lessons.find((p) => p.id === l.id);
          const cls = ['lesson-item', l.id === lesson.id ? 'active' : '', st.unlocked ? '' : 'locked'].join(' ');
          const icon = st.completed ? '<span class="stat done">✓</span>' : st.unlocked ? `<span class="stat">${i + 1}</span>` : '<span class="stat">🔒</span>';
          return `<button class="${cls}" data-lesson="${l.id}" data-unlocked="${st.unlocked}">
            ${icon}
            <span class="l-title">${esc(l.title)}<span class="l-type">${typeLabel[l.type] || l.type}</span></span>
          </button>`;
        }).join('')}
      </aside>
      <section class="lesson-pane" id="lessonPane"></section>
    </div>`;

  document.querySelectorAll('.lesson-item').forEach((btn) =>
    btn.addEventListener('click', () => {
      if (btn.dataset.unlocked !== 'true') {
        toast('🔒 This lesson is locked — complete the previous lessons first.', true);
        return;
      }
      location.hash = `#/course/${courseId}/lesson/${btn.dataset.lesson}`;
    })
  );

  const pane = document.getElementById('lessonPane');
  if (lesson.type === 'video') renderVideoLesson(pane, course, lesson, lp);
  else if (lesson.type === 'quiz') renderQuizLesson(pane, course, lesson, lp);
  else renderTextLesson(pane, course, lesson, lp);
}

function lessonHeader(lesson) {
  const typeLabel = { text: 'Reading', video: 'Video lesson', quiz: 'Final exam' };
  return `<div class="lesson-kind">${typeLabel[lesson.type]}</div><h1>${esc(lesson.title)}</h1>`;
}

async function completeLesson(course, lesson) {
  const r = await api(`/api/courses/${course.id}/lessons/${lesson.id}/complete`, { method: 'POST' });
  if (r.courseCompleted) return showCourseComplete(course, r.certId);
  const idx = course.lessons.findIndex((l) => l.id === lesson.id);
  const next = course.lessons[idx + 1];
  toast('✓ Lesson complete!');
  location.hash = next ? `#/course/${course.id}/lesson/${next.id}` : `#/course/${course.id}`;
}

function renderTextLesson(pane, course, lesson, lp) {
  pane.innerHTML = `
    ${lessonHeader(lesson)}
    <div class="lesson-content">${lesson.html}</div>
    <div class="lesson-actions">
      ${lp.completed
        ? `<span class="pill-done">✓ Completed</span><button class="btn btn-primary" id="nextBtn">Next lesson →</button>`
        : `<button class="btn btn-accent btn-lg" id="completeBtn">Complete &amp; continue →</button>`}
    </div>`;
  document.getElementById('completeBtn')?.addEventListener('click', () => completeLesson(course, lesson).catch((e) => toast(e.message, true)));
  document.getElementById('nextBtn')?.addEventListener('click', () => {
    const idx = course.lessons.findIndex((l) => l.id === lesson.id);
    const next = course.lessons[idx + 1];
    location.hash = next ? `#/course/${course.id}/lesson/${next.id}` : `#/course/${course.id}`;
  });
}

// --- Video lesson with the 58/60-second watch gate -------------------------
// Rules:
//  * Watch time only accrues during actual playback (timeupdate deltas).
//  * Seeking forward past what you've already watched snaps back.
//  * Heartbeats report accrued seconds to the server, which owns the gate.
//  * "Complete & continue" stays disabled until the server confirms the
//    requirement (58s of a 60s video) is satisfied.
function renderVideoLesson(pane, course, lesson, lp) {
  const required = lesson.minWatchSeconds;
  pane.innerHTML = `
    ${lessonHeader(lesson)}
    <div class="lesson-content">${lesson.html}</div>
    <div class="video-shell">
      <video id="lessonVideo" src="${lesson.videoUrl}" preload="metadata" playsinline></video>
      <div class="v-controls">
        <button id="playBtn" title="Play / pause">▶</button>
        <div class="v-track"><div class="v-fill" id="vFill"></div></div>
        <span class="v-time" id="vTime">0:00 / ${fmtTime(lesson.durationSeconds)}</span>
        <button id="muteBtn" title="Mute / unmute">🔊</button>
      </div>
    </div>
    <div class="watch-meter">
      <span>Watch requirement:</span>
      <div class="progress-track"><div class="progress-fill" id="watchFill" style="width:0%"></div></div>
      <span id="watchLabel">0s / ${required}s</span>
    </div>
    <p class="no-skip-tip">⏩ Fast-forwarding is disabled. You must watch at least ${required} seconds of this
      ${lesson.durationSeconds}-second video before you can continue.</p>
    <div class="lesson-actions">
      ${lp.completed
        ? `<span class="pill-done">✓ Completed</span><button class="btn btn-primary" id="nextBtn">Next lesson →</button>`
        : `<button class="btn btn-accent btn-lg" id="completeBtn" disabled>Complete &amp; continue →</button>
           <span class="gate-note" id="gateNote">Watch the video to unlock this button.</span>`}
    </div>`;

  const video = document.getElementById('lessonVideo');
  const playBtn = document.getElementById('playBtn');
  const muteBtn = document.getElementById('muteBtn');
  const completeBtn = document.getElementById('completeBtn');

  // We credit watch time by the furthest point the learner has legitimately
  // reached through real playback (a high-water mark), not by summing per-tick
  // deltas — the latter silently loses fractional seconds and could strand a
  // diligent viewer just short of the requirement. Because seeking forward is
  // blocked (see below), maxPlayed only advances during genuine playback, so
  // it is both lossless and cheat-resistant. The server clamps how far this can
  // jump per heartbeat, so a forged request still can't skip the whole video.
  let serverWatched = lp.watchedSeconds || 0; // furthest point the server has credited
  let maxPlayed = serverWatched;              // furthest point reached via real playback
  let lastReported = serverWatched;           // last position sent to the server
  let satisfied = lp.completed || serverWatched >= required;
  let sending = false;

  function updateMeter() {
    const total = Math.min(required, Math.max(serverWatched, maxPlayed));
    document.getElementById('watchFill').style.width = `${Math.min(100, (total / required) * 100)}%`;
    const label = document.getElementById('watchLabel');
    label.textContent = `${Math.floor(total)}s / ${required}s`;
    if (satisfied || maxPlayed >= required) {
      satisfied = true;
      label.innerHTML = `<span class="ok">✓ Requirement met</span>`;
      if (completeBtn) {
        completeBtn.disabled = false;
        const note = document.getElementById('gateNote');
        if (note) note.textContent = 'Nice — requirement met. You can continue.';
      }
    }
  }

  async function flushWatch(force = false) {
    // Report the furthest point played. Skip if nothing new to report.
    if (sending || (!force && maxPlayed - lastReported < 4)) return;
    if (maxPlayed <= lastReported && !force) return;
    sending = true;
    const position = maxPlayed;
    try {
      const r = await api(`/api/courses/${course.id}/lessons/${lesson.id}/watch`, {
        method: 'POST', body: { position },
      });
      serverWatched = r.watchedSeconds;
      lastReported = position;
      if (r.satisfied) satisfied = true;
    } catch { /* keep lastReported; retry on next flush */ }
    sending = false;
    updateMeter();
  }

  video.addEventListener('timeupdate', () => {
    // Advance the high-water mark only during real playback. Seeking forward is
    // blocked, so currentTime can only exceed maxPlayed by playing through.
    if (!video.paused && video.currentTime > maxPlayed) {
      maxPlayed = Math.min(video.duration || lesson.durationSeconds, video.currentTime);
    }
    document.getElementById('vFill').style.width = `${(video.currentTime / (video.duration || lesson.durationSeconds)) * 100}%`;
    document.getElementById('vTime').textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration || lesson.durationSeconds)}`;
    updateMeter();
    flushWatch();
  });

  // Anti-skip: any attempt to seek beyond what's been watched snaps back.
  video.addEventListener('seeking', () => {
    if (video.currentTime > maxPlayed + 1) {
      video.currentTime = maxPlayed;
      toast('⏩ Skipping ahead is disabled for this lesson.', true);
    }
  });
  video.addEventListener('pause', () => flushWatch(true));
  video.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    // Reaching the end is only possible by playing through (seeking forward is
    // blocked), so the learner has watched the whole video — credit its full
    // length, including the final seconds that pause between the last
    // timeupdate and this event.
    maxPlayed = video.duration || lesson.durationSeconds;
    updateMeter();
    flushWatch(true);
  });

  playBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); playBtn.textContent = '⏸'; }
    else { video.pause(); playBtn.textContent = '▶'; }
  });
  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  });

  videoTracker = { flush: () => flushWatch(true) };

  completeBtn?.addEventListener('click', async () => {
    await flushWatch(true);
    completeLesson(course, lesson).catch((e) => {
      toast(e.message, true);
      const note = document.getElementById('gateNote');
      if (note) { note.textContent = e.message; note.classList.add('err'); }
    });
  });
  document.getElementById('nextBtn')?.addEventListener('click', () => {
    const idx = course.lessons.findIndex((l) => l.id === lesson.id);
    const next = course.lessons[idx + 1];
    location.hash = next ? `#/course/${course.id}/lesson/${next.id}` : `#/course/${course.id}`;
  });

  updateMeter();
}

function renderQuizLesson(pane, course, lesson, lp) {
  pane.innerHTML = `
    ${lessonHeader(lesson)}
    <div class="lesson-content">${lesson.html}</div>
    ${lp.completed ? `<div class="quiz-result pass">✓ Exam passed with ${lp.quizScore}%. Your license is recorded.</div>` : ''}
    <form id="quizForm">
      ${lesson.questions.map((q, i) => `
        <div class="quiz-q">
          <h3>${i + 1}. ${esc(q.prompt)}</h3>
          ${q.options.map((opt, oi) => `
            <label class="quiz-opt">
              <input type="radio" name="${q.id}" value="${oi}" required />
              <span>${esc(opt)}</span>
            </label>`).join('')}
        </div>`).join('')}
      <div id="quizResult"></div>
      <div class="lesson-actions">
        <button class="btn btn-accent btn-lg" type="submit">Submit exam</button>
        <span class="gate-note">Pass mark: ${lesson.passPercent}%</span>
      </div>
    </form>`;

  document.getElementById('quizForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const answers = Object.fromEntries(new FormData(e.target).entries());
    try {
      const r = await api(`/api/courses/${course.id}/lessons/${lesson.id}/quiz`, { method: 'POST', body: { answers } });
      if (r.passed && r.courseCompleted) return showCourseComplete(course, r.certId, r.score);
      const box = document.getElementById('quizResult');
      box.innerHTML = r.passed
        ? `<div class="quiz-result pass">✓ You passed with ${r.score}% (${r.correct}/${r.total} correct).</div>`
        : `<div class="quiz-result fail">✗ You scored ${r.score}% (${r.correct}/${r.total} correct). You need ${r.passPercent}% — review the lessons and try again.</div>`;
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) { toast(err.message, true); }
  });
}

async function showCourseComplete(course, certId, score) {
  await refreshMe(); // pick up the new notification badge
  app.innerHTML = `
    <div class="complete-hero">
      <div class="big">🏆</div>
      <h1>Congratulations!</h1>
      <p>You have completed <strong>${esc(course.title)}</strong>${score != null ? ` with a final exam score of <strong>${score}%</strong>` : ''}.</p>
      <div>
        <span class="notice-sent">📨 A completion notice has been sent to you and to NCYSA</span>
      </div>
      <p style="margin-top:14px">
        <a class="btn btn-primary btn-lg" href="#/cert/${certId}">View your certificate</a>
        <a class="btn btn-ghost btn-lg" href="#/courses" style="margin-left:10px">Back to courses</a>
      </p>
    </div>`;
}

async function viewCertificate(certId) {
  const c = await api(`/api/certificate/${certId}`);
  const date = new Date(c.completedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  app.innerHTML = `
    <div class="certificate">
      ${logoImg('cert-logo')}
      <div class="org">North Carolina Youth Soccer Association</div>
      <h1>Certificate of Completion</h1>
      <p>This certifies that</p>
      <div class="learner-name">${esc(c.learner)}</div>
      <p>has successfully completed</p>
      <div class="course-name">${esc(c.course)}</div>
      <div class="cert-meta">Completed ${date} · Certificate ID ${esc(c.certId)}</div>
      <div class="seal">🏅</div>
    </div>
    <p style="text-align:center; margin-bottom:48px">
      <button class="btn btn-primary" onclick="window.print()">Print certificate</button>
      <a class="btn btn-ghost" href="#/courses" style="margin-left:10px">Back to courses</a>
    </p>`;
}

async function viewNotifications() {
  const { notifications } = await api('/api/notifications');
  app.innerHTML = `
    <div class="notif-list">
      <h2 style="margin-bottom:18px">Your notifications</h2>
      ${notifications.length ? notifications.map((n) => `
        <div class="notif ${n.read ? '' : 'unread'}">
          <h3>${esc(n.title)}</h3>
          <time>${new Date(n.createdAt).toLocaleString()}</time>
          <p>${esc(n.body)}</p>
        </div>`).join('') : '<p class="empty">No notifications yet — finish a course to get your first one!</p>'}
    </div>`;
  if (notifications.some((n) => !n.read)) {
    await api('/api/notifications/read', { method: 'POST' });
    await refreshMe();
  }
}

  const d = await api('/api/admin/overview');
  app.innerHTML = `
    <div class="admin-wrap">
      <h1>NCYSA Education Dashboard</h1>
      <p class="lead" style="color:var(--ink-soft)">${d.learnerCount} registered learner${d.learnerCount === 1 ? '' : 's'} ·
        ${d.completions.length} course completion${d.completions.length === 1 ? '' : 's'}</p>
      <div class="admin-grid">
        <div class="admin-card">
          <h2>🏅 Course completions (license records)</h2>
          ${d.completions.length ? `
            <table class="admin-table">
              <tr><th>Learner</th><th>Email</th><th>Course</th><th>Completed</th><th>Certificate</th></tr>
              ${d.completions.map((c) => `
                <tr><td>${esc(c.learner)}</td><td>${esc(c.email)}</td><td>${esc(c.course)}</td>
                    <td>${new Date(c.completedAt).toLocaleString()}</td><td>${esc(c.certId)}</td></tr>`).join('')}
            </table>` : '<p class="empty">No completions yet.</p>'}
        </div>
        <div class="admin-card">
          <h2>🔔 NCYSA notifications</h2>
          ${d.ncysaNotifications.length ? d.ncysaNotifications.map((n) => `
            <div class="notif"><h3>${esc(n.title)}</h3>
              <time>${new Date(n.createdAt).toLocaleString()}</time><p>${esc(n.body)}</p></div>`).join('')

          ${d.outbox.length ? d.outbox.map((m) => `
            <div class="mail">

// ---------- router ----------

const routes = [
  { re: /^#?\/?$/, fn: viewHome },
  { re: /^#\/courses$/, fn: viewCatalog },
  { re: /^#\/login$/, fn: viewLogin },
  { re: /^#\/register$/, fn: viewRegister },
  { re: /^#\/course\/([\w-]+)$/, fn: (m) => viewCourse(m[1]) },
  { re: /^#\/course\/([\w-]+)\/lesson\/([\w-]+)$/, fn: (m) => viewCourse(m[1], m[2]) },
  { re: /^#\/cert\/([\w-]+)$/, fn: (m) => viewCertificate(m[1]) },
  { re: /^#\/notifications$/, fn: viewNotifications },
  { re: /^#\/admin$/, fn: viewAdmin },
];

async function route() {
  if (videoTracker) { videoTracker.flush(); videoTracker = null; }
  const hash = location.hash || '#/';
  for (const r of routes) {
    const m = hash.match(r.re);
    if (m) {
      try { await r.fn(m); } catch (e) {
        if (e.status === 401) { location.hash = '#/login'; return; }
        app.innerHTML = `<div class="section"><div class="card"><h2>Something went wrong</h2><p class="sub">${esc(e.message)}</p></div></div>`;
      }
      window.scrollTo(0, 0);
      return;
    }
  }
  location.hash = '#/';
}

window.addEventListener('hashchange', route);
(async function init() {
  await refreshMe();
  await route();
})();

</script>
