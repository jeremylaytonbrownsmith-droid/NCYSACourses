# One-click deploy on Render (https://render.com):
# New + > Blueprint > point it at this repo.
#
# This blueprint runs on Render's FREE web-service tier. Free instances have no
# persistent disk and sleep after ~15 min idle, so durable storage lives in
# Firebase Firestore (set FIREBASE_SERVICE_ACCOUNT below) and a keep-alive ping
# (see .github/workflows/keepalive.yml) prevents cold starts. To upgrade later,
# change `plan: free` to `plan: starter` (~$7/mo) for an always-on instance.
#
# SCORM course packages (uploaded .zip modules) are FILES, too big for Firestore.
# On the free tier they live on the ephemeral disk and are lost on each redeploy,
# which is fine for testing but NOT for production. For durable uploads: set
# `plan: starter`, uncomment the `disk:` block and the SCORM_DIR env var below,
# and size the disk to a couple GB (roughly 2× the total size of your .zip
# modules). Uploaded packages then survive restarts and redeploys.
#
# You will be prompted to enter these values in the Render dashboard (they are
# NOT stored in this file, so no secret is ever committed to git):
#   FIREBASE_SERVICE_ACCOUNT — the Firebase service-account JSON (paste the whole
#                              file contents) so courses/records persist in Firestore
#   ADMIN_PASSWORD     — password for the NCYSA staff dashboard (education@ncysa.org)
#   EDITOR_PASSWORD    — password for the course designer (DA@ncsoccer.org / Colin)
#   NOTIFY_WEBHOOK_URL — optional: a Zapier/Make webhook to deliver completion emails
services:
  - type: web
    name: ncysa-learn
    runtime: node
    plan: standard # 1 CPU / 2 GB RAM — enough memory to accept large SCORM uploads
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/courses
    # Durable storage for uploaded SCORM packages (needs a paid plan, above).
    disk:
      name: scorm-packages
      mountPath: /var/scorm
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/ncysa-data # ephemeral local cache; Firestore is the source of truth
      # Uploaded SCORM packages live on the persistent disk so they survive
      # restarts/redeploys.
      - key: SCORM_DIR
        value: /var/scorm
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # paste the entire service-account JSON here (never committed)
      # ---- Optional: offload module videos to a Bunny CDN (all four required to
      #      enable it; leave unset to serve videos from the disk as normal) ----
      - key: BUNNY_STORAGE_ZONE
        sync: false # e.g. ncysa-modules
      - key: BUNNY_STORAGE_HOST
        sync: false # region endpoint host, e.g. ny.storage.bunnycdn.com
      - key: BUNNY_STORAGE_KEY
        sync: false # storage zone Access Key / Password (secret)
      - key: BUNNY_CDN_HOST
        sync: false # pull-zone hostname, e.g. ncysa-modules.b-cdn.net
      - key: ADMIN_EMAIL
        value: education@ncysa.org
      - key: ADMIN_PASSWORD
        sync: false # you type this in the Render dashboard (never committed)
      - key: EDITOR_EMAIL
        value: DA@ncsoccer.org
      - key: EDITOR_PASSWORD
        sync: false # Colin's course-designer password — a value you choose
      - key: STAFF_ACCESS_CODE
        sync: false # shared code that unlocks the Staff Portal (choose any phrase)
      - key: NCYSA_NOTIFY_EMAIL
        value: education@ncysa.org
      # ---- Real email delivery (certificates land in learners' inboxes) ----
      # RECOMMENDED on Render (it blocks outbound SMTP): use an HTTPS email API.
      # Set ONE of BREVO_API_KEY or SENDGRID_API_KEY, plus EMAIL_FROM (verify
      # that From address as a "single sender" in the provider's dashboard).
      - key: EMAIL_FROM
        sync: false # the verified From address (e.g. education@ncysa.org)
      - key: BREVO_API_KEY
        sync: false # Brevo (brevo.com) HTTPS API key — free tier
      - key: SENDGRID_API_KEY
        sync: false # or SendGrid (sendgrid.com) HTTPS API key — free tier
      # ---- Alternative: SMTP (only on hosts that allow outbound SMTP) ----
      - key: SMTP_HOST
        sync: false # e.g. smtp.gmail.com  (blocked on Render — use an API above)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false # optional alternative: a Zapier/Make webhook
