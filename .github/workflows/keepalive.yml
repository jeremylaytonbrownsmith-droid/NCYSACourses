# Keep the free-tier Render instance awake.
#
# Render's free web service sleeps after ~15 minutes with no traffic, and a cold
# wake takes ~30-60s. This workflow pings the app's health endpoint every 10
# minutes so learners always hit a warm instance.
#
# SETUP (one time): in this repo, go to Settings > Secrets and variables >
# Actions > Variables, and add a repository variable named APP_URL set to your
# Render URL (e.g. https://ncysa-learn.onrender.com). No secret/token needed —
# it just makes a public GET request.
#
# If you upgrade Render to the always-on Starter plan, you can delete this file.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}     # allow a manual run from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it warm
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL repository variable is not set — skipping. See this file's header for setup."
            exit 0
          fi
          echo "Pinging $URL/api/courses"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/api/courses" || echo 000)
          echo "HTTP $code"
