name: Nightly Improve
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Read TODO.md, pick the top item, implement it, run the tests, and open a pull request. Change one thing only."
          claude_args: "--max-turns 30"
